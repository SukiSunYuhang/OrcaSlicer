  <style>
    /* Theme tokens: dark by default; light via prefers-color-scheme (when no explicit
       ?dark_mode= param) or via html[data-theme] set from ?dark_mode=1|0. */
    :root {
      --fe-bg: #1F1E23;
      --fe-title: #FFFFFF;
      --fe-desc: rgba(255, 255, 255, 0.6);
      --fe-spinner-track: rgba(255, 255, 255, 0.18);
      --fe-btn-bg: #4379FC;
      --fe-btn-text: #FCFCFC;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        --fe-bg: #FFFFFF;
        --fe-title: #18181B;
        --fe-desc: rgba(53, 53, 56, 0.6);
        --fe-spinner-track: rgba(0, 0, 0, 0.08);
      }
    }
    :root[data-theme="dark"] {
      --fe-bg: #1F1E23;
      --fe-title: #FFFFFF;
      --fe-desc: rgba(255, 255, 255, 0.6);
      --fe-spinner-track: rgba(255, 255, 255, 0.18);
    }
    :root[data-theme="light"] {
      --fe-bg: #FFFFFF;
      --fe-title: #18181B;
      --fe-desc: rgba(53, 53, 56, 0.6);
      --fe-spinner-track: rgba(0, 0, 0, 0.08);
    }

    #flutter-loading {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--fe-bg); color: var(--fe-title);
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .flutter-loading__spinner {
      width: 44px; height: 44px; margin-bottom: 20px;
      border: 4px solid var(--fe-spinner-track);
      border-top-color: #4d9fff;
      border-radius: 50%;
      animation: flutter-spin 0.9s linear infinite;
    }
    .flutter-loading__text { font-size: 15px; opacity: 0.85; }
    @keyframes flutter-spin { to { transform: rotate(360deg); } }

    /* ---- Error page: Figma 弱网 design ----
       Button: pill 110x40, bg #4379FC, text #FCFCFC (both themes) */
    #flutter-error {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--fe-bg);
      font-family: "HarmonyOS Sans SC", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .flutter-error__card {
      display: flex; flex-direction: column; align-items: center;
      width: 336px; gap: 24px; padding: 0 16px;
    }
    .flutter-error__main {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .flutter-error__art { width: 160px; height: 120px; display: block; }
    /* Illustration theme: dark art shown by default; light art shown when the
       effective theme is light (explicit data-theme=light or system light with no override). */
    .flutter-error__art--light { display: none; }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) .flutter-error__art--dark { display: none; }
      :root:not([data-theme]) .flutter-error__art--light { display: block; }
    }
    :root[data-theme="dark"] .flutter-error__art--light { display: none; }
    :root[data-theme="dark"] .flutter-error__art--dark { display: block; }
    :root[data-theme="light"] .flutter-error__art--dark { display: none; }
    :root[data-theme="light"] .flutter-error__art--light { display: block; }
    .flutter-error__texts {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .flutter-error__title {
      color: var(--fe-title);
      font-size: 18px; font-weight: 500; line-height: 21px;
      text-align: center;
    }
    .flutter-error__desc {
      color: var(--fe-desc);
      font-size: 14px; font-weight: 400; line-height: 16.4px;
      text-align: center;
    }
    .flutter-error__reload {
      appearance: none;
      width: 110px; height: 40px;
      border: 2px solid var(--fe-btn-bg);
      border-radius: 80px;
      background: var(--fe-btn-bg);
      color: var(--fe-btn-text);
      font-family: "HarmonyOS Sans SC", Roboto, -apple-system, "Segoe UI", Arial, sans-serif;
      font-size: 14px; font-weight: 500; line-height: 24px;
      cursor: pointer;
    }
    .flutter-error__reload:active { transform: translateY(1px); }
    .flutter-error__detail {
      position: fixed; left: 0; right: 0; bottom: 16px;
      padding: 0 24px; box-sizing: border-box;
      color: var(--fe-desc);
      font-family: -apple-system, "Segoe UI", Roboto, Menlo, monospace;
      font-size: 12px; line-height: 1.5;
      text-align: center; opacity: 0.8;
      word-break: break-all; white-space: pre-wrap;
    }
    .flutter-error__detail:empty { display: none; }
  </style>

  <!-- URL params for the bootstrap overlays (loading / error):
       dark_mode=1|0 (also accepts the legacy typo dark_model) — explicit theme override
       (absent: follow prefers-color-scheme, dark default)
       locale=zh-cn-CN — Chinese UI text; any other value falls back to English -->

        var m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));

      // The native container currently injects "dark_model" (typo); accept both spellings.
      var dark = getParam('dark_mode');
